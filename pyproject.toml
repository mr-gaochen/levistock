[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "levistock"
version = "0.1.6"
description = "A股市场数据SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "tqdm>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["levistock*"]
